<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BMO · IA personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Fraunces:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2fae93;
    --panel: #cdeedd;
    --panel-2: #b8e4c9;
    --line: #163b32;
    --text: #16241c;
    --text-dim: #4b6058;
    --rose: #e2534b;
    --yellow: #f4c63e;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 560px;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 18px;
    background: var(--panel-2);
    border-bottom: 2px solid var(--line);
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .who { line-height: 1.3; }
  .who .name { font-size: 14.5px; font-weight: 600; }
  .who .status { font-size: 11.5px; color: #1c6e58; }
  .status::before {
    content: '●';
    margin-right: 4px;
    font-size: 8px;
  }

  .chat {
    flex: 1;
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    justify-content: flex-end;
  }

  .row { display: flex; }
  .row.me { justify-content: flex-end; }
  .row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.55;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .bubble.show { opacity: 1; transform: translateY(0); }

  .row.me .bubble {
    background: var(--rose);
    color: #fff;
    border: 2px solid var(--line);
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: var(--panel-2);
    border: 2px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .label {
    font-size: 10.5px;
    color: var(--text-dim);
    margin: 2px 4px 0;
  }

  .answer {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.6;
  }
  .answer .sign {
    display: block;
    margin-top: 10px;
    font-style: normal;
    font-weight: 500;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .inputbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--line);
    background: var(--panel-2);
  }
  .fake-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 13px;
    color: var(--text);
    min-height: 18px;
  }
  .fake-input .cursor {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: var(--text);
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
    margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .send {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--rose);
    border: 2px solid var(--line);
    color: #fff;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(226,83,75,.55); }
    50% { box-shadow: 0 0 0 8px rgba(226,83,75,0); }
  }

  @media (max-width: 400px) {
    .app { min-height: 520px; }
    .chat { padding: 18px 12px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="avatar" id="avatar">
      <svg viewBox="0 0 40 40" width="24" height="24">
        <rect x="2" y="4" width="36" height="32" rx="4" fill="#2fae93" stroke="#163b32" stroke-width="1.5"/>
        <rect x="7" y="9" width="26" height="17" rx="2" fill="#b8e4c9" stroke="#163b32" stroke-width="1.2"/>
        <circle cx="15" cy="17.5" r="1.6" fill="#16241c"/>
        <circle cx="25" cy="17.5" r="1.6" fill="#16241c"/>
        <path d="M16 21 Q20 25 24 21 L24 22.5 Q20 25.5 16 22.5 Z" fill="#3c4a34" stroke="#16241c" stroke-width="0.8"/>
        <circle cx="12" cy="31" r="2.3" fill="#e2534b"/>
        <circle cx="20" cy="31" r="2.3" fill="#2a5ea3"/>
        <circle cx="28" cy="31" r="2.3" fill="#f4c63e"/>
      </svg>
    </div>
    <div class="who">
      <div class="name">BMO · tu IA personal</div>
      <div class="status">en línea</div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inputbar" id="inputbar">
    <div class="fake-input" id="fakeInput"></div>
    <div class="send" id="sendBtn" role="button" aria-label="Enviar">➤</div>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const fakeInput = document.getElementById('fakeInput');
const sendBtn = document.getElementById('sendBtn');
const question = "Describe lo que siente Joao por Josefina";
const steps = [
  "Entrando en el corazón de Joao...",
  "Analizando momentos hermosos contigo...",
  "Encontrando sentimientos únicos por ti..."
];
const answer = "Analizando... corazón de Joao: 100% ocupado por ti, sin espacio libre en el disco.\nNivel de amor: fuera de rango, no se pudo calcular un límite superior.\nConclusión: te ama de una forma que ninguna IA sabría explicar mejor que él mismo.";
const finalMessage = "No hay IA que describa lo que realmente siento por ti, ya que es único e inigualable. Amo tu sonrisa y tu risa, amo tu manera de ser y sentir, amo tu dulzura y tu pasión, amo quien me he convertido al estar contigo, amo que seas todo lo que yo he querido. Eres mi personita favorita, con quien deseo y anhelo estar todos los días, con quien pienso antes de dormir y al despertar. Eres mi todo, amorcito mío, te amo mi Josefina.";

function addBubble(rowClass, html, extraClass) {
  const row = document.createElement('div');
  row.className = 'row ' + rowClass;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (extraClass ? ' ' + extraClass : '');
  bubble.innerHTML = html;
  row.appendChild(bubble);
  chat.appendChild(row);
  requestAnimationFrame(() => bubble.classList.add('show'));
  return bubble;
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeQuestion() {
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  await wait(400);
  await new Promise(resolve => {
    const iv = setInterval(() => {
      i++;
      fakeInput.textContent = question.slice(0, i);
      fakeInput.appendChild(cursor);
      if (i >= question.length) { clearInterval(iv); resolve(); }
    }, 32);
  });
}

async function runProcessing() {
  for (const text of steps) {
    addBubble('bot', '<span class="label" style="margin:0;">' + text + '</span>', 'processing');
    await wait(2000);
  }
  const answerHtml = '<div class="answer">' + answer.replace(/\n/g, '<br>') + '<span class="sign">— generado por BMO, con datos 100% reales</span></div>';
  addBubble('bot', answerHtml);

  await wait(2200);
  addBubble('bot', '<span class="label" style="margin:0;">Joao está escribiendo...</span><br><span class="typing-dots" style="margin-top:4px;"><span></span><span></span><span></span></span>', 'processing');
  await wait(2000);
  const lastBot = chat.querySelector('.row.bot:last-child');
  if (lastBot) lastBot.remove();

  addBubble('me', finalMessage.replace(/\n/g, '<br>'));
}

let started = false;
sendBtn.addEventListener('click', async () => {
  if (started) return;
  started = true;
  sendBtn.style.opacity = '.4';
  sendBtn.style.pointerEvents = 'none';

  await typeQuestion();
  await wait(400);
  fakeInput.textContent = '';
  addBubble('me', question);

  await wait(700);
  await runProcessing();
});
</script>

</body>
</html>
